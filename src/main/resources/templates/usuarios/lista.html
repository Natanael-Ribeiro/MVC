<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Usuarios</title>
</head>
<body>
<h1>Usuarios</h1>
<nav>
	<a href="/">Inicio</a> |
	<a href="/livros">Livros</a> |
	<a href="/usuarios">Usuarios</a> |
	<a href="/emprestimos">Emprestimos</a>
</nav>
<hr>
<a href="/usuarios/novo">Novo Usuario</a>
<br><br>
<table border="1" cellpadding="6">
	<thead>
		<tr>
			<th>ID</th>
			<th>Nome</th>
			<th>Email</th>
			<th>Matricula</th>
			<th>Acoes</th>
		</tr>
	</thead>
	<tbody>
		<tr th:each="usuario : ${usuarios}">
			<td th:text="${usuario.id}"></td>
			<td th:text="${usuario.nome}"></td>
			<td th:text="${usuario.email}"></td>
			<td th:text="${usuario.matricula}"></td>
			<td>
				<a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a> |
				<a th:href="@{/usuarios/excluir/{id}(id=${usuario.id})}">Excluir</a>
			</td>
		</tr>
	</tbody>
</table>
</body>
</html>
